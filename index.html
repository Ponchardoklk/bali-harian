  // compra
  const inp = $('#addItem');
  inp.oninput = () => sugerencias(inp.value);
  inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); anadirEscrito(); } };
  inp.onblur = () => setTimeout(() => $('#sugBox').classList.add('hide'), 180);
  $('#addItemBtn').onclick = anadirEscrito;
  $('#fxChip').onclick = sheetConversor;

  // clics delegados
  document.addEventListener('click', (e) => {
    const t = (s) => e.target.closest('[' + s + ']');
    let el;

    if (el = t('data-add')) {
      const c = CATALOGO.find(x => x[0] === el.dataset.add);
      if (c) anadirItem(c[0], c[1], c[2], c[3], c[4]);
      $('#addItem').value = ''; $('#sugBox').classList.add('hide');
      return;
    }
    if (el = t('data-go')) { irA(el.dataset.go); return; }
    if (el = t('data-sheet')) {
      const s = el.dataset.sheet;
      if (s === 'gasto') sheetMov('gasto');
      if (s === 'ingreso') sheetMov('ingreso');
      if (s === 'evento') sheetEvento(null);
      if (s === 'cerrar') sheetCerrar();
      if (s === 'ajustes') sheetAjustes();
      if (s === 'recur') sheetRecur(null);
      if (s === 'meta') sheetMeta(null);
      if (s === 'visado') sheetVisado();
      if (s === 'notas') sheetNotas();
      if (s === 'fotos') sheetFotos();
      if (s === 'sitios') sheetSitios();
      if (s === 'moto') sheetMoto();
      if (s === 'frases') sheetFrases(null);
      if (s === 'habitos') sheetHabitos();
      if (s === 'tiempo') sheetTiempo();
      if (s === 'bienvenida') sheetBienvenida();
      return;
    }
    if (el = t('data-hab')) {
      const h = S.habitos.find(x => x.id === el.dataset.hab);
      if (!h) return;
      const f = hoyIso(), i = h.hechos.indexOf(f);
      if (i >= 0) h.hechos.splice(i, 1); else h.hechos.push(f);
      guardar(); renderHabitos();
      return;
    }
    if (el = t('data-pagar')) {
      const r = S.recur.find(x => x.id === el.dataset.pagar);
      if (!r) return;
      const m = { id: uid(), tipo: r.tipo, val: r.val, mon: r.mon, fx: S.fx,
        cat: r.cat || (r.tipo === 'ingreso' ? 'Otros' : 'Servicios'), nota: r.nombre, fecha: hoyIso() };
      S.movs.push(m);
      r.ultimoPago = hoyIso().slice(0, 7);
      guardar(); render();
      toast('Apuntado: ' + r.nombre, () => {
        S.movs = S.movs.filter(x => x.id !== m.id);
        delete r.ultimoPago;
        guardar(); render();
      });
      return;
    }
    if (el = t('data-tareas-limpiar')) {
      const copia = S.tareas.slice();
      S.tareas = S.tareas.filter(x => !x.hecha);
      guardar(); renderTareas();
      toast('Quitadas', () => { S.tareas = copia; guardar(); renderTareas(); });
      return;
    }
    if (el = t('data-tarea-chk')) {
      const x = S.tareas.find(y => y.id === el.dataset.tareaChk);
      if (x) { x.hecha = !x.hecha; guardar(); renderTareas(); }
      return;
    }
    if (el = t('data-tarea-del')) {
      const id = el.dataset.tareaDel;
      const i = S.tareas.findIndex(y => y.id === id);
      if (i < 0) return;
      const [x] = S.tareas.splice(i, 1);
      guardar(); renderTareas();
      toast('Borrado', () => { S.tareas.splice(i, 0, x); guardar(); renderTareas(); });
      return;
    }
    if (el = t('data-ev-chk')) { toggleEvento(el.dataset.evChk, el.dataset.f); return; }
    if (el = t('data-ev-edit')) {
      const ev = S.eventos.find(x => x.id === el.dataset.evEdit);
      if (ev) sheetEvento(ev);
      return;
    }
    if (el = t('data-it-chk')) {
      const i = S.lista.find(x => x.id === el.dataset.itChk);
      if (i) { i.hecho = !i.hecho; guardar(); renderCompra(); }
      return;
    }
    if (el = t('data-it-edit')) {
      const i = S.lista.find(x => x.id === el.dataset.itEdit);
      if (i) sheetItem(i);
      return;
    }
    if (el = t('data-mov')) {
      const m = S.movs.find(x => x.id === el.dataset.mov);
      if (m) sheetMov(m.tipo, m);
      return;
    }
    if (el = t('data-recur')) {
      const r = S.recur.find(x => x.id === el.dataset.recur);
      if (r) sheetRecur(r);
      return;
    }
    if (el = t('data-meta')) {
      const g = S.metas.find(x => x.id === el.dataset.meta);
      if (g) sheetMeta(g);
      return;
    }
    if (el = t('data-dia')) {
      diaSel = el.dataset.dia;
      const d = deIso(diaSel);
      if (d.getMonth() !== calMes.getMonth() || d.getFullYear() !== calMes.getFullYear()) calMes = d;
      if (vista !== 'agenda') irA('agenda'); else renderAgenda();
      return;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { cerrarSheet(); if ($('#mktHost').innerHTML) cerrarMercado(); }
  });

  // Una app instalada en el móvil no se cierra: se queda abierta días. Si pasa
  // la medianoche, "Hoy" tiene que dejar de ser el día de ayer.
  let diaPintado = hoyIso();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (hoyIso() !== diaPintado) {
      diaPintado = hoyIso();
      if (vista === 'agenda' && diaSel < diaPintado) { diaSel = diaPintado; calMes = new Date(); }
      mesVis = diaPintado.slice(0, 7);
      render();
    }
  });

  irA('hoy');
  if (!S.visto) setTimeout(sheetBienvenida, 350);
  if (!almacenOK) setTimeout(() => toast('Este navegador no guarda datos — mira Ajustes'), 900);

  // Lo de internet va después de pintar y nunca bloquea: si no hay cobertura,
  // la app funciona igual con los últimos datos que guardó.
  refrescarDeInternet();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refrescarDeInternet();
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);
else arrancar();

</script>
<script>
// El service worker es lo que hace que la app abra sin internet.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* sin conexion la primera vez */ });
  });
}
</script>
</body>
</html>
