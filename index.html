<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bali Harian</title>
<meta name="description" content="Agenda, la compra en Bali y control de gastos. Todo se guarda en tu movil.">
<meta name="theme-color" content="#0C6B59">

<!-- para que al instalarla en el iPhone se abra a pantalla completa -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bali Harian">
<meta name="format-detection" content="telephone=no">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">

<style>
:root{
  --bg:#EFF3F0;
  --surface:#FFFFFF;
  --surface-2:#E4EBE6;
  --ink:#131D18;
  --ink-2:#3D4C46;
  --muted:#5F6E66;
  --line:#DCE4DE;
  --line-2:#BECABF;

  --accent:#0C6B59;
  --accent-ink:#FFFFFF;
  --accent-soft:#D8EAE4;
  --amber:#9A6008;
  --amber-soft:#FAEBD3;
  --pos:#1F6B41;
  --pos-soft:#DCEEE2;
  --neg:#A3392A;
  --neg-soft:#F9E2DD;
  --info:#1A5E80;
  --info-soft:#DCEAF2;
  --plum:#6B3F6E;
  --plum-soft:#F0E2F1;

  --radius:13px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(19,29,24,.06);
  --shadow-2:0 2px 10px rgba(19,29,24,.08);
  --font-d:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --font-b:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1512; --surface:#16211D; --surface-2:#1F2C27;
    --ink:#E8EFEA; --ink-2:#B2C1BA; --muted:#82948C;
    --line:#26332E; --line-2:#36473F;
    --accent:#3FBFA1; --accent-ink:#06211B; --accent-soft:#123430;
    --amber:#E2A950; --amber-soft:#33270F;
    --pos:#4FC087; --pos-soft:#0F2E1F;
    --neg:#E4735C; --neg-soft:#3B211C;
    --info:#5BB2DA; --info-soft:#102C3A;
    --plum:#C08CC4; --plum-soft:#2C1B2E;
    --shadow:0 1px 2px rgba(0,0,0,.32);
    --shadow-2:0 2px 10px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1512; --surface:#16211D; --surface-2:#1F2C27;
  --ink:#E8EFEA; --ink-2:#B2C1BA; --muted:#82948C;
  --line:#26332E; --line-2:#36473F;
  --accent:#3FBFA1; --accent-ink:#06211B; --accent-soft:#123430;
  --amber:#E2A950; --amber-soft:#33270F;
  --pos:#4FC087; --pos-soft:#0F2E1F;
  --neg:#E4735C; --neg-soft:#3B211C;
  --info:#5BB2DA; --info-soft:#102C3A;
  --plum:#C08CC4; --plum-soft:#2C1B2E;
  --shadow:0 1px 2px rgba(0,0,0,.32);
  --shadow-2:0 2px 10px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-b); font-size:14.5px; line-height:1.4;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:540px;margin:0 auto;padding:0 12px calc(88px + env(safe-area-inset-bottom,0px))}
/* La tipografia de maquina solo en las cifras protagonistas. En textos cortos
   («25,89 €», «520 € de 1.500 €») los espacios quedan sueltos y se lee fatal;
   ahi va la fuente normal con los digitos alineados. */
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.cif{font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
.top{
  position:sticky;top:0;z-index:40;background:var(--bg);
  padding:calc(9px + env(safe-area-inset-top,0px)) 0 7px;
  border-bottom:1px solid var(--line);margin-bottom:11px;
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{
  font-family:var(--font-d);font-weight:800;font-size:20px;line-height:1.05;margin:0;
  letter-spacing:-.03em;
}
.top .date{font-size:11.5px;color:var(--muted);margin-top:1px}
.fx-chip{
  display:flex;align-items:center;gap:5px;flex:none;
  border:1px solid var(--line-2);background:var(--surface);border-radius:99px;
  padding:6px 11px 6px 9px;line-height:1;
}
.fx-chip svg{width:14px;height:14px;color:var(--accent);flex:none;stroke-width:2}
.fx-chip .fx-v{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.fx-chip .fx-k{font-size:10.5px;color:var(--muted);font-weight:600}
.fx-chip .punto{width:5px;height:5px;border-radius:99px;background:var(--amber);flex:none}

/* ---------- bloques ---------- */
.sec{margin-bottom:14px}
.sec-h{display:flex;align-items:center;gap:6px;margin:0 0 6px;padding:0 2px}
.sec-h h2{
  font-family:var(--font-b);font-size:11px;font-weight:700;letter-spacing:.01em;
  color:var(--ink-2);margin:0;flex:1;
}
.sec-h svg{width:14px;height:14px;flex:none;stroke-width:2}
.sec-h .der{margin-left:auto;display:flex;gap:9px;align-items:center;flex:none}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.card + .card{margin-top:6px}
.pad{padding:11px 12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 11px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.row-s{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.row-fin{text-align:right;flex:none;line-height:1.25}
.row-fin b{font-weight:600;font-size:13.5px;display:block}
.empty{padding:16px 12px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}

/* ---------- botones ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line-2);background:var(--surface);border-radius:var(--radius-sm);
  padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink);
  transition:background .12s,border-color .12s;
}
.btn:active{background:var(--surface-2)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:active{filter:brightness(1.12)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-w{width:100%}
.btn-danger{color:var(--neg);border-color:var(--neg)}
.icon-btn{
  width:27px;height:27px;flex:none;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);
}
.icon-btn:active{background:var(--surface-2)}
.link{color:var(--accent);font-weight:600;font-size:12px;white-space:nowrap}

/* ---------- métricas ---------- */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.metric{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 10px;box-shadow:var(--shadow);min-width:0;
}
.metric .k{
  font-size:10px;color:var(--muted);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.metric .v{
  font-family:var(--font-d);font-weight:800;font-size:18px;letter-spacing:-.035em;
  margin-top:1px;line-height:1.1;
}
.metric .u{font-size:11px;color:var(--muted);margin-top:0}
.v.pos{color:var(--pos)} .v.neg{color:var(--neg)} .v.a{color:var(--accent)}

/* ---------- tarjeta destacada del dia ---------- */
.hero{
  border-radius:var(--radius);padding:10px 11px;color:var(--accent-ink);
  background:linear-gradient(140deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 78%,#000) 100%);
  box-shadow:var(--shadow-2);position:relative;overflow:hidden;
}
.hero.m{background:linear-gradient(140deg,var(--amber) 0%,color-mix(in srgb,var(--amber) 74%,#000) 100%)}
.hero.n{background:linear-gradient(140deg,var(--neg) 0%,color-mix(in srgb,var(--neg) 74%,#000) 100%)}
.hero .hk{
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  opacity:.82;display:flex;align-items:center;gap:5px;
}
.hero .hk svg{width:13px;height:13px;stroke-width:2.2}
.hero .hv{
  font-family:var(--font-d);font-weight:800;font-size:22px;letter-spacing:-.035em;
  margin-top:4px;line-height:1.05;
}
.hero .hs{font-size:11.5px;opacity:.85;margin-top:2px}
.hero .bar{background:rgba(255,255,255,.26);margin-top:9px}
.hero .bar i{background:rgba(255,255,255,.92)}
.hero .bar-l{color:rgba(255,255,255,.82)}

/* ---------- barra de progreso ---------- */
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar i.warn{background:var(--amber)}
.bar i.over{background:var(--neg)}
.bar-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px;gap:8px}
.bar-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- píldoras / estado ---------- */
.pill{
  display:inline-flex;align-items:center;gap:4px;flex:none;
  font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);
}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.m{background:var(--amber-soft);color:var(--amber)}
.pill.n{background:var(--neg-soft);color:var(--neg)}
.pill.i{background:var(--info-soft);color:var(--info)}
.pill.p{background:var(--plum-soft);color:var(--plum)}
.stripe{width:3px;align-self:stretch;border-radius:99px;background:var(--line-2);flex:none;min-height:24px}
.stripe.a{background:var(--accent)} .stripe.m{background:var(--amber)}
.stripe.n{background:var(--neg)} .stripe.i{background:var(--info)}
.stripe.p{background:var(--plum)} .stripe.g{background:var(--pos)}

/* ---------- pestañas inferiores ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));
}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px 3px;
  border-radius:9px;color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:.01em;
}
.tab svg{width:20px;height:20px;stroke-width:1.75}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* ---------- formularios ---------- */
label.f{display:block;margin-bottom:9px}
label.f > span{
  display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px;
}
.inp{
  width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--radius-sm);
  background:var(--surface);font-size:16px;
}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:60px;resize:vertical;font-size:15px;line-height:1.5}
select.inp{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 51%,calc(100% - 10px) 51%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;
}
.f-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--radius-sm);overflow:hidden}
.seg button{
  flex:1;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted);
  border-right:1px solid var(--line-2);background:var(--surface);
}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ---------- hoja modal ---------- */
.sheet-bg{
  position:fixed;inset:0;z-index:60;background:rgba(9,18,15,.44);
  display:flex;align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(18px);opacity:.4}}
.sheet{
  width:100%;max-width:540px;background:var(--bg);
  border-radius:17px 17px 0 0;border-top:1px solid var(--line);
  max-height:92vh;overflow-y:auto;animation:rise .2s cubic-bezier(.2,.8,.3,1);
  padding:0 13px calc(18px + env(safe-area-inset-bottom,0px));
}
.sheet-h{
  position:sticky;top:0;background:var(--bg);z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px;
}
.sheet-h h3{font-family:var(--font-d);font-weight:800;font-size:17px;margin:0;letter-spacing:-.025em}

/* ---------- calendario ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px}
.cal-h b{font-family:var(--font-d);font-weight:800;font-size:15px;letter-spacing:-.025em}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 7px 3px}
.cal-dow span{text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 7px 8px}
.cal-d{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:8px;font-size:13px;font-family:var(--font-m);font-weight:500;color:var(--ink);
  border:1px solid transparent;
}
.cal-d.out{color:var(--muted);opacity:.4}
.cal-d.today{border-color:var(--accent);color:var(--accent);font-weight:600}
.cal-d[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cal-d .dot{width:4px;height:4px;border-radius:99px;background:var(--amber)}
.cal-d[aria-selected="true"] .dot{background:var(--accent-ink)}

/* ---------- lista de la compra ---------- */
.chk{
  width:22px;height:22px;flex:none;border:1.7px solid var(--line-2);border-radius:7px;
  display:grid;place-items:center;color:transparent;background:var(--surface);
}
.chk[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done .row-t{text-decoration:line-through;color:var(--muted)}
.sug{
  position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);
  box-shadow:0 8px 22px rgba(9,18,15,.16);overflow:hidden;max-height:236px;overflow-y:auto;
}
.sug button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 11px;text-align:left;border-bottom:1px solid var(--line)}
.sug button:last-child{border-bottom:none}
.sug button:active{background:var(--accent-soft)}
.id-word{font-style:italic;color:var(--amber);font-weight:600}

/* ---------- modo mercado ---------- */
.mkt{
  position:fixed;inset:0;z-index:70;background:var(--bg);
  display:flex;flex-direction:column;
  padding:calc(13px + env(safe-area-inset-top,0px)) 15px calc(13px + env(safe-area-inset-bottom,0px));
}
.mkt-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px}
.mkt-id{font-family:var(--font-d);font-weight:800;font-size:clamp(36px,12.5vw,58px);line-height:1;letter-spacing:-.045em;color:var(--accent)}
.mkt-es{font-size:18px;font-weight:600}
.mkt-qty{font-family:var(--font-m);font-size:24px;font-weight:600;margin-top:2px}
.mkt-nav{display:flex;align-items:center;justify-content:space-between;gap:9px}
.mkt-count{font-family:var(--font-m);font-size:12.5px;color:var(--muted)}

/* ---------- gráfico de barras ---------- */
.chart{display:flex;flex-direction:column;gap:7px}
.ch-row{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:8px;font-size:12px}
.ch-bar{height:14px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.ch-bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.ch-v{font-family:var(--font-m);font-size:11.5px;font-weight:500;color:var(--ink-2);letter-spacing:-.03em}
.ch-k{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- rejilla de accesos (pantalla Mas) ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{
  display:flex;flex-direction:column;gap:3px;padding:10px 11px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.tile:active{background:var(--surface-2)}
.tile svg{width:19px;height:19px;stroke-width:1.9}
.tile b{font-size:13.5px;font-weight:600}
.tile span{font-size:11px;color:var(--muted);line-height:1.35}

/* ---------- hábitos ---------- */
.hab{display:flex;gap:6px;overflow-x:auto;padding:1px}
.hab button{
  flex:1;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 4px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow);
}
.hab button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hab .hn{font-size:11px;font-weight:600;text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hab .hr{font-family:var(--font-m);font-size:10px;opacity:.8;letter-spacing:-.02em}
.hab svg{width:18px;height:18px;stroke-width:2}

/* ---------- el tiempo ---------- */
.wx{display:flex;align-items:center;gap:10px;padding:9px 11px}
.wx-ico{width:31px;height:31px;flex:none;color:var(--info)}
.wx-t{font-family:var(--font-d);font-weight:800;font-size:19px;letter-spacing:-.035em;line-height:1}
.wx-d{font-size:11.5px;color:var(--muted);margin-top:2px}
.wx-dias{display:flex;gap:4px;border-top:1px solid var(--line);padding:5px 7px}
.wx-dia{flex:1;text-align:center;min-width:0}
.wx-dia .d{font-size:10px;color:var(--muted);font-weight:600;text-transform:capitalize}
.wx-dia .t{font-family:var(--font-m);font-size:11.5px;font-weight:500;letter-spacing:-.03em}
.wx-dia .p{font-size:10px;color:var(--info);font-weight:600}
.wx-dia svg{width:17px;height:17px;color:var(--muted);margin:1px 0}

/* ---------- fotos ---------- */
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.foto{
  position:relative;aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line);
}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .et{
  position:absolute;left:0;right:0;bottom:0;padding:3px 5px;font-size:9.5px;font-weight:600;
  color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ---------- varios ---------- */

<script>
/* ==========================================================================
   Bali Harian — núcleo: estado, guardado, formatos, catálogo
   ========================================================================== */

const KEY = 'baliHarian.v1';

const DEFAULTS = () => ({
  v: 3,
  fx: 20600,                 // rupias por 1 euro; se actualiza solo al abrir
  fxAuto: true,              // buscar el cambio del día en internet
  presupuestoComida: 700000, // rupias por semana en compra de comida
  eventos: [],
  tareas: [],                // pendientes sueltos, sin día fijo
  lista: [],
  plantillas: [],            // listas de la compra guardadas
  movs: [],
  recur: [],
  metas: [],
  precios: {},               // producto -> último precio real pagado (IDR)
  visado: { entrada: '', dias: 30, tipo: '' },
  notas: [],
  sitios: [],
  fotos: [],                 // sólo los datos; la imagen va en IndexedDB
  habitos: [],
  moto: { nombre: '', alquilerHasta: '', aceiteUltimo: '', aceiteCada: 60 },
  lugar: { nombre: 'Canggu', lat: -8.65, lon: 115.13 },
  fxTocado: '',              // cuándo se actualizó el tipo de cambio
  visto: false               // ya vio la bienvenida
});

let S = DEFAULTS();
let almacenOK = true;

const esFecha = (x) => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x) && !isNaN(deIso(x));

/* Todo lo que entra de fuera (una copia vieja, un archivo a medias, un JSON
   tocado a mano) pasa por aquí. Una app que se queda en blanco sin explicación
   no hay quien la recupere. */
function sanear(d) {
  const s = Object.assign(DEFAULTS(), d && typeof d === 'object' ? d : {});

  ['eventos', 'tareas', 'lista', 'plantillas', 'movs', 'recur', 'metas'].forEach(k => {
    if (!Array.isArray(s[k])) s[k] = [];
  });
  if (!s.precios || typeof s.precios !== 'object' || Array.isArray(s.precios)) s.precios = {};

  const fx = parseFloat(s.fx);
  s.fx = isFinite(fx) && fx > 0 ? fx : 18500;
  const pres = parseFloat(s.presupuestoComida);
  s.presupuestoComida = isFinite(pres) && pres >= 0 ? pres : 700000;

  if (!s.visado || typeof s.visado !== 'object') s.visado = { entrada: '', dias: 30, tipo: '' };
  if (!esFecha(s.visado.entrada)) s.visado.entrada = '';
  s.visado.dias = Math.min(3650, Math.max(1, parseInt(s.visado.dias) || 30));

  s.movs = s.movs.filter(m => m && esFecha(m.fecha) && isFinite(parseFloat(m.val)))
    .map(m => Object.assign({}, m, { val: parseFloat(m.val), mon: m.mon === 'EUR' ? 'EUR' : 'IDR', cat: m.cat || 'Otros' }));
  s.eventos = s.eventos.filter(e => e && esFecha(e.fecha) && e.t)
    .map(e => Object.assign({}, e, { hechos: Array.isArray(e.hechos) ? e.hechos : [] }));
  s.tareas = s.tareas.filter(t => t && t.t);
  s.lista = s.lista.filter(i => i && i.nombre).map(i => Object.assign({}, i, {
    donde: DONDE[i.donde] ? i.donde : 'otro',
    qty: Math.max(1, parseInt(i.qty) || 1),
    precio: Math.max(0, parseFloat(i.precio) || 0),
    unidad: i.unidad || 'ud'
  }));
  s.plantillas = s.plantillas.filter(p => p && p.nombre && Array.isArray(p.items));
  ['notas', 'sitios', 'fotos', 'habitos'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  s.notas = s.notas.filter(n => n && (n.t || n.texto));
  s.sitios = s.sitios.filter(x => x && x.nombre);
  s.fotos = s.fotos.filter(f => f && f.id);
  s.habitos = s.habitos.filter(h => h && h.nombre)
    .map(h => Object.assign({}, h, { hechos: Array.isArray(h.hechos) ? h.hechos : [] }));
  if (!s.moto || typeof s.moto !== 'object') s.moto = { nombre: '', alquilerHasta: '', aceiteUltimo: '', aceiteCada: 60 };
  if (!esFecha(s.moto.alquilerHasta)) s.moto.alquilerHasta = '';
  if (!esFecha(s.moto.aceiteUltimo)) s.moto.aceiteUltimo = '';
  s.moto.aceiteCada = Math.max(7, parseInt(s.moto.aceiteCada) || 60);
  if (!s.lugar || typeof s.lugar !== 'object' || !isFinite(s.lugar.lat)) {
    s.lugar = { nombre: 'Canggu', lat: -8.65, lon: 115.13 };
  }
  s.recur = s.recur.filter(r => r && r.nombre && isFinite(parseFloat(r.val)))
    .map(r => Object.assign({}, r, { dia: Math.min(31, Math.max(1, parseInt(r.dia) || 1)) }));
  s.metas = s.metas.filter(g => g && g.nombre)
    .map(g => Object.assign({}, g, { objetivo: Math.max(0, parseFloat(g.objetivo) || 0), aportado: Math.max(0, parseFloat(g.aportado) || 0) }));

  return s;
}

function cargar() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) S = sanear(JSON.parse(raw));
    localStorage.setItem(KEY + '.test', '1');
    localStorage.removeItem(KEY + '.test');
  } catch (e) {
    almacenOK = false;
  }
}

let guardarPend = null;

function guardarYa() {
  clearTimeout(guardarPend);
  guardarPend = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { almacenOK = false; }
}

function guardar() {
  clearTimeout(guardarPend);
  guardarPend = setTimeout(guardarYa, 120);
}

// En el móvil la app se cierra de golpe: si hay una escritura esperando su turno,
// ese cambio se perdería. Al pasar a segundo plano se vuelca ya.
window.addEventListener('pagehide', guardarYa);
window.addEventListener('beforeunload', guardarYa);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') guardarYa();
});

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

/* ---------------------------- fechas ---------------------------- */

const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function deIso(s) {
  const [a, m, d] = s.split('-').map(Number);
  return new Date(a, m - 1, d);
}
const hoyIso = () => iso(new Date());
function sumaDias(s, n) { const d = deIso(s); d.setDate(d.getDate() + n); return iso(d); }

function fechaLarga(s) {
  const d = deIso(s);
  return DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()];
}
function fechaCorta(s) {
  const d = deIso(s);
  return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3);
}
function etiquetaDia(s) {
  if (s === hoyIso()) return 'Hoy';
  if (s === sumaDias(hoyIso(), 1)) return 'Mañana';
  if (s === sumaDias(hoyIso(), -1)) return 'Ayer';
  return fechaCorta(s);
}
// lunes de la semana de una fecha
function lunes(s) {
  const d = deIso(s);
  const off = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - off);
  return iso(d);
}

/* ---------------------------- dinero ---------------------------- */

// formato español: punto de millar siempre (es-ES omite el punto en 4 cifras,
// y "Rp 8500" al lado de "Rp 15.000" se lee fatal), coma decimal.
function nf(n, dec = 0) {
  if (!isFinite(n)) n = 0;
  const neg = n < 0;
  const partes = Math.abs(n).toFixed(dec).split('.');
  const ent = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '-' : '') + ent + (partes[1] ? ',' + partes[1] : '');
}

// el signo va delante del símbolo: "−Rp 450.000", no "Rp -450.000"
const signo = (n) => (n < 0 ? '−' : '');

function fmtIDR(n) { return signo(n) + 'Rp ' + nf(Math.abs(Math.round(n))); }

function fmtIDRcorto(n) {
  const a = Math.abs(n);
  if (a >= 1000000) return signo(n) + 'Rp ' + nf(a / 1000000, a >= 10000000 ? 1 : 2) + ' M';
  if (a >= 10000) return signo(n) + 'Rp ' + nf(a / 1000, 0) + 'k';
  return signo(n) + 'Rp ' + nf(Math.round(a));
}

function fmtEUR(n) {
  const a = Math.abs(n);
  return signo(n) + nf(a, a >= 1000 ? 0 : 2) + ' €';
}

const idrAeur = (idr) => idr / (S.fx || 18500);
const eurAidr = (eur) => eur * (S.fx || 18500);

// un movimiento guarda su moneda original y el cambio del día en que se apuntó
function movIDR(m) { return m.mon === 'EUR' ? m.val * (m.fx || S.fx) : m.val; }
function movEUR(m) { return m.mon === 'EUR' ? m.val : m.val / (m.fx || S.fx); }

/* ---------------------------- visado ----------------------------
   En Indonesia el día que aterrizas ya cuenta como día 1, y pasarse cuesta
   1.000.000 Rp por cada día de más. Vale la pena tenerlo a la vista.
   ---------------------------------------------------------------- */

const MULTA_DIA_IDR = 1000000;

function visadoInfo() {
  const v = S.visado;
  if (!v || !esFecha(v.entrada)) return null;
  const total = v.dias || 30;
  const caduca = sumaDias(v.entrada, total - 1);
  const h = hoyIso();
  const dia = (a, b) => Math.round((deIso(b) - deIso(a)) / 86400000);
  const usados = dia(v.entrada, h) + 1;
  const restantes = dia(h, caduca);
  return {
    caduca, total, restantes,
    usados: Math.max(0, Math.min(usados, total)),
    empezado: h >= v.entrada,
    pasado: restantes < 0,
    multa: restantes < 0 ? Math.abs(restantes) * MULTA_DIA_IDR : 0
  };
}

/* ---------------------------- categorías ---------------------------- */

// icono suelto, para encabezados y fichas
function ico(nombre, tam, color) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') +
    '" stroke-linecap="round" stroke-linejoin="round" width="' + (tam || 14) + '" height="' + (tam || 14) + '">' +
    (ICONOS[nombre] || '') + '</svg>';
}

// cabecera de sección: icono + título + lo que vaya a la derecha
function secH(icono, color, titulo, der) {
  return '<div class="sec-h">' +
    (icono ? '<span style="color:var(--' + color + ');display:flex">' + ico(icono, 14) + '</span>' : '') +
    '<h2>' + esc(titulo) + '</h2>' +
    (der ? '<span class="der">' + der + '</span>' : '') +
  '</div>';
}

/* ---------------------------- internet ----------------------------
   Todo lo de fuera es opcional: si no hay cobertura la app sigue igual con
   el último dato que consiguió. ------------------------------------- */

async function traerJSON(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || 7000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

// El cambio del día. Dos fuentes: si la primera falla, la segunda.
async function actualizarCambio(forzar) {
  if (!S.fxAuto && !forzar) return null;
  if (!forzar && S.fxTocado === hoyIso()) return null;   // ya se miró hoy
  const fuentes = [
    ['https://api.frankfurter.dev/v1/latest?base=EUR&symbols=IDR', d => d && d.rates && d.rates.IDR],
    ['https://open.er-api.com/v6/latest/EUR', d => d && d.rates && d.rates.IDR]
  ];
  for (const [url, saca] of fuentes) {
    try {
      const v = saca(await traerJSON(url));
      if (isFinite(v) && v > 1000 && v < 100000) {
        S.fx = Math.round(v);
        S.fxTocado = hoyIso();
        guardar();
        return S.fx;
      }
    } catch (e) { /* probamos la siguiente */ }
  }
  return null;
}

let tiempoCache = null;

async function traerTiempo() {
  const l = S.lugar;
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + l.lat + '&longitude=' + l.lon +
    '&current=temperature_2m,precipitation,weather_code' +
    '&hourly=precipitation_probability' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&timezone=auto&forecast_days=5';
  const d = await traerJSON(url);
  if (!d || !d.current || !d.daily) throw new Error('respuesta rara');
  // ¿a qué hora de hoy es más probable que llueva?
  let pico = null;
  if (d.hourly && d.hourly.time) {
    const ahora = new Date();
    for (let i = 0; i < d.hourly.time.length; i++) {
      const t = d.hourly.time[i];
      if (!t.startsWith(hoyIso())) continue;
      const hora = +t.slice(11, 13);
      if (hora < ahora.getHours()) continue;
      const p = d.hourly.precipitation_probability[i];
      if (p >= 55 && (!pico || p > pico.p)) pico = { hora, p };
    }
  }
  tiempoCache = {
    dia: hoyIso(), momento: Date.now(),
    temp: d.current.temperature_2m, code: d.current.weather_code,
    lluviaAhora: d.current.precipitation,
    pico,
    dias: d.daily.time.map((f, i) => ({
      fecha: f, code: d.daily.weather_code[i],
      max: d.daily.temperature_2m_max[i], min: d.daily.temperature_2m_min[i],
      prob: d.daily.precipitation_probability_max[i]
    }))
  };
  try { localStorage.setItem(KEY + '.tiempo', JSON.stringify(tiempoCache)); } catch (e) {}
  return tiempoCache;
}

function tiempoGuardado() {
  if (tiempoCache) return tiempoCache;
  try {
    const raw = localStorage.getItem(KEY + '.tiempo');
    if (raw) tiempoCache = JSON.parse(raw);
  } catch (e) {}
  return tiempoCache;
}

/* ---------------------------- fotos ----------------------------
   Una foto no cabe en el almacen normal del navegador, asi que van aparte.
   -------------------------------------------------------------- */

const DB_NOMBRE = 'baliHarianFotos';
let _db = null;

function abrirDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((ok, mal) => {
    const req = indexedDB.open(DB_NOMBRE, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('fotos')) db.createObjectStore('fotos');
    };
    req.onsuccess = () => { _db = req.result; ok(_db); };
    req.onerror = () => mal(req.error);
  });
}

function guardarFoto(id, blob) {
  return abrirDB().then(db => new Promise((ok, mal) => {
    const tx = db.transaction('fotos', 'readwrite');
    tx.objectStore('fotos').put(blob, id);
    tx.oncomplete = ok; tx.onerror = () => mal(tx.error);
  }));
}

function leerFoto(id) {
  return abrirDB().then(db => new Promise((ok, mal) => {
    const req = db.transaction('fotos', 'readonly').objectStore('fotos').get(id);
    req.onsuccess = () => ok(req.result || null);
    req.onerror = () => mal(req.error);
  }));
}

function borrarFoto(id) {
  return abrirDB().then(db => new Promise((ok) => {
    const tx = db.transaction('fotos', 'readwrite');
    tx.objectStore('fotos').delete(id);
    tx.oncomplete = ok; tx.onerror = ok;
  }));
}

/* Las fotos del móvil pesan varios MB. Se reducen antes de guardarlas: para
   leer un pasaporte o un ticket sobra de largo con 1400 px. */
function encogerImagen(file, maxLado, calidad) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const esc = Math.min(1, (maxLado || 1400) / Math.max(img.width, img.height));
      const w = Math.round(img.width * esc), h = Math.round(img.height * esc);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : mal(new Error('no se pudo convertir')), 'image/jpeg', calidad || 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('no es una imagen')); };
    img.src = url;
  });
}

/* ---------------------------- avisos ---------------------------- */

let toastT = null;

// El segundo argumento convierte el aviso en un "deshacer": borrar algo sin red
// debajo da mucho miedo en una app donde apuntas dinero.
function toast(msg, deshacer) {
  const h = document.getElementById('toastHost');
  h.innerHTML = '<div class="toast">' + esc(msg) +
    (deshacer ? '<button id="undoBtn" style="margin-left:11px;color:var(--accent);font-weight:700">Deshacer</button>' : '') +
    '</div>';
  clearTimeout(toastT);
  toastT = setTimeout(() => { h.innerHTML = ''; }, deshacer ? 5200 : 2400);
  if (deshacer) {
    document.getElementById('undoBtn').onclick = () => {
      clearTimeout(toastT);
      h.innerHTML = '';
      deshacer();
    };
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ==========================================================================
   Bali Harian — vistas: Hoy, Agenda, Compra
   ========================================================================== */

let vista = 'hoy';
let calMes = new Date();
let diaSel = hoyIso();

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

function irA(v) {
  vista = v;
  $$('.view').forEach(el => el.classList.toggle('hide', el.id !== 'v-' + v));
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  const fab = $('#fab');
  fab.classList.toggle('hide', v === 'compra' || v === 'mas');
  fab.setAttribute('aria-label', v === 'agenda' ? 'Apuntar en la agenda' : 'Apuntar un gasto');
  window.scrollTo(0, 0);
  render();
}

function render() {
  renderTop();
  if (vista === 'hoy') renderHoy();
  if (vista === 'agenda') renderAgenda();
  if (vista === 'compra') renderCompra();
  if (vista === 'dinero') renderDinero();
  if (vista === 'mas') renderMas();
}

/* ---------------------------- cabecera ---------------------------- */

function saludo() {
  const h = new Date().getHours();
  if (h < 6) return 'Buenas noches';
  if (h < 13) return 'Buenos días';
  if (h < 21) return 'Buenas tardes';
  return 'Buenas noches';
}

function horaEs() {
  try {
    return new Intl.DateTimeFormat('es-ES', {
      timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit'
    }).format(new Date());
  } catch (e) { return null; }
}

// Días desde que se actualizó el cambio. Con el automático activo esto casi
// nunca salta; sólo si lleva días sin cobertura.
function fxCaducado() {
  if (!S.fxTocado) return S.movs.length > 6;
  return Math.round((deIso(hoyIso()) - deIso(S.fxTocado)) / 86400000) > 7;
}

function renderTop() {
  const titulos = { hoy: saludo(), agenda: 'Agenda', compra: 'La compra', dinero: 'Dinero', mas: 'Más' };
  $('#viewTitle').textContent = titulos[vista];
  const he = horaEs();
  $('#topDate').textContent = fechaLarga(hoyIso()) + (vista === 'hoy' && he ? ' · en España, ' + he : '');
  $('#fxVal').textContent = nf(S.fx);
  $('#fxPunto').classList.toggle('hide', !fxCaducado());
}

/* ---------------------------- eventos ---------------------------- */

function eventosEnDia(f) {
  return S.eventos.filter(e => {
    if (e.fecha === f) return true;
    if (!e.rep || e.rep === 'no' || f < e.fecha) return false;
    const a = deIso(e.fecha), b = deIso(f);
    if (e.rep === 'sem') return a.getDay() === b.getDay();
    if (e.rep === 'mes') {
      // algo del día 31 tiene que caer el 28 en febrero, o desaparecería
      const ultimo = new Date(b.getFullYear(), b.getMonth() + 1, 0).getDate();
      return b.getDate() === Math.min(a.getDate(), ultimo);
    }
    return false;
  }).sort((a, b) => (a.hora || '99:99').localeCompare(b.hora || '99:99'));
}

const evHecho = (e, f) => (e.hechos || []).includes(f);

function toggleEvento(id, f) {
  const e = S.eventos.find(x => x.id === id);
  if (!e) return;
  e.hechos = e.hechos || [];
  const i = e.hechos.indexOf(f);
  if (i >= 0) e.hechos.splice(i, 1); else e.hechos.push(f);
  guardar(); render();
}

function filaEvento(e, f) {
  const hecho = evHecho(e, f);
  const rep = e.rep === 'sem' ? 'cada semana' : e.rep === 'mes' ? 'cada mes' : '';
  const sub = [e.hora || '', rep, e.nota || ''].filter(Boolean).join(' · ');
  return '<div class="row' + (hecho ? ' done' : '') + '">' +
    '<button class="chk" aria-checked="' + hecho + '" data-ev-chk="' + e.id + '" data-f="' + f + '" aria-label="Marcar hecho">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" width="12" height="12"><path d="m5 13 4 4L19 7"/></svg>' +
    '</button>' +
    '<button class="row-main" style="text-align:left" data-ev-edit="' + e.id + '">' +
      '<div class="row-t">' + esc(e.t) + '</div>' +
      (sub ? '<div class="row-s">' + esc(sub) + '</div>' : '') +
    '</button>' +
  '</div>';
}

/* ---------------------------- tareas ---------------------------- */

function renderTareas() {
  const pend = S.tareas.filter(t => !t.hecha);
  const hechas = S.tareas.filter(t => t.hecha);

  const fila = (t) =>
    '<div class="row' + (t.hecha ? ' done' : '') + '">' +

        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" width="12" height="12"><path d="m5 13 4 4L19 7"/></svg>' +
      '</button>' +
      '<div class="row-main"><div class="row-t" style="white-space:normal">' + esc(t.t) + '</div></div>' +
      '<button class="icon-btn" data-tarea-del="' + t.id + '" aria-label="Borrar">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
      '</button>' +
    '</div>';

  $('#hoyPendientes').innerHTML =
    secH('tarea', 'accent', 'Pendientes',
      pend.length ? '<span class="note">' + pend.length + (pend.length === 1 ? ' cosa' : ' cosas') + '</span>' : '') +
    '<div class="card">' +
      '<div class="row" style="gap:7px">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" style="color:var(--muted);flex:none"><path d="M12 5v14M5 12h14"/></svg>' +
        '<input id="addTarea" class="row-main" placeholder="Algo que tienes que hacer…" autocomplete="off"' +
        ' style="border:none;background:none;outline:none;font-size:15px;padding:0;width:100%">' +
      '</div>' +
      pend.map(fila).join('') +
      (hechas.length
        ? '<div class="row" style="padding:6px 12px;background:var(--surface-2)">' +
            '<span class="row-s" style="flex:1">' + hechas.length + ' hecha' + (hechas.length > 1 ? 's' : '') + '</span>' +
            '<button class="link" data-tareas-limpiar="1">Quitar las hechas</button></div>' +
          hechas.map(fila).join('')
        : '') +
    '</div>';

  const tin = $('#addTarea');
  tin.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); anadirTarea(tin.value); tin.value = ''; }
  };
}

function anadirTarea(txt) {
  txt = txt.trim();
  if (!txt) return;
  S.tareas.unshift({ id: uid(), t: txt, hecha: false, creada: hoyIso() });
  guardar(); renderTareas();
}

function renderTiempo() {
  const w = tiempoGuardado();

    ? '<span class="pill i">Lluvia sobre las ' + w.pico.hora + ':00</span>'

/* ---------------------------- hábitos ---------------------------- */

function rachaHabito(h) {
  let n = 0, f = hoyIso();
  if (!h.hechos.includes(f)) f = sumaDias(f, -1);   // hoy aún cuenta si ayer sí
  while (h.hechos.includes(f)) { n++; f = sumaDias(f, -1); }
  return n;
}

function renderHabitos() {
  const host = $('#hoyHabitos');
  if (!S.habitos.length) { host.innerHTML = ''; return; }
  const h = hoyIso();
  const hechos = S.habitos.filter(x => x.hechos.includes(h)).length;

  host.innerHTML =
    secH('racha', 'plum', 'Rutina de hoy',
      '<span class="note">' + hechos + ' de ' + S.habitos.length + '</span>' +
      '<button class="link" data-sheet="habitos">Editar</button>') +
    '<div class="hab">' + S.habitos.map(x => {
      const hoyOk = x.hechos.includes(h);
      const r = rachaHabito(x);
      return '<button data-hab="' + x.id + '" aria-pressed="' + hoyOk + '">' +
        (hoyOk
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="18" height="18"><path d="m5 13 4 4L19 7"/></svg>'
          : ico('racha', 18)) +
        '<span class="hn">' + esc(x.nombre) + '</span>' +
        '<span class="hr">' + (r > 0 ? r + (r === 1 ? ' día' : ' días') : '—') + '</span>' +
      '</button>';
    }).join('') + '</div>';
}

/* ---------------------------- HOY ---------------------------- */

function gastosDe(desde, hasta) {
  return S.movs.filter(m => m.tipo === 'gasto' && m.fecha >= desde && m.fecha <= hasta);
}

function semanaComida() {
  const h = hoyIso(), l = lunes(h), d = sumaDias(l, 6);
  const gastado = gastosDe(l, d).filter(m => m.cat === 'Compra').reduce((s, m) => s + movIDR(m), 0);
  const pres = S.presupuestoComida || 0;
  return { l, d, gastado, pres, queda: pres - gastado, pct: pres > 0 ? Math.min(100, (gastado / pres) * 100) : 0 };
}

/* La tarjeta grande de arriba enseña lo único que de verdad urge hoy. Si no
   urge nada, enseña el dinero de la semana, que es lo que se mira a diario. */
function renderHero() {
  const v = visadoInfo();
  const c = semanaComida();

  if (v && v.pasado) {
    return { html:
      '<button class="hero n" data-sheet="visado" style="width:100%;text-align:left;display:block">' +
        '<div class="hk">' + ico('aviso', 13) + 'Visado caducado</div>' +
        '<div class="hv">' + Math.abs(v.restantes) + (Math.abs(v.restantes) === 1 ? ' día de más' : ' días de más') + '</div>' +
        '<div class="hs">Caducó el ' + fechaLarga(v.caduca) + '. La multa va por ' + fmtIDR(MULTA_DIA_IDR) + ' al día.</div>' +
      '</button>', comidaAparte: true };
  }
  if (v && v.empezado && v.restantes <= 14) {
    const urge = v.restantes <= 7;
    return { html:
      '<button class="hero ' + (urge ? 'n' : 'm') + '" data-sheet="visado" style="width:100%;text-align:left;display:block">' +
        '<div class="hk">' + ico('visado', 13) + 'Visado · día ' + v.usados + ' de ' + v.total + '</div>' +
        '<div class="hv">' + (v.restantes === 0 ? 'Se acaba hoy' : v.restantes + (v.restantes === 1 ? ' día' : ' días') + ' de margen') + '</div>' +
        '<div class="bar"><i style="width:' + Math.min(100, (v.usados / v.total) * 100) + '%"></i></div>' +
        '<div class="bar-l"><span>Entraste el ' + fechaCorta(S.visado.entrada) + '</span><span>Hasta el ' + fechaCorta(v.caduca) + '</span></div>' +
      '</button>', comidaAparte: true };
  }
  // nada urgente: el dinero de la compra de la semana
  const pasado = c.queda < 0;
  return { html:
    '<button class="hero' + (pasado ? ' m' : '') + '" data-sheet="ajustes" style="width:100%;text-align:left;display:block">' +
      '<div class="hk">' + ico('compra', 13) + 'Compra de esta semana</div>' +
      '<div class="hv">' + (pasado ? 'Te has pasado ' + fmtIDR(-c.queda) : 'Te quedan ' + fmtIDR(c.queda)) + '</div>' +
      '<div class="bar"><i style="width:' + c.pct + '%"></i></div>' +
      '<div class="bar-l"><span>' + fmtIDR(c.gastado) + ' de ' + fmtIDR(c.pres) + '</span>' +
      '<span>' + fechaCorta(c.l) + ' – ' + fechaCorta(c.d) + '</span></div>' +
    '</button>', comidaAparte: false };
}

function renderHoy() {
  const h = hoyIso();
  const hero = renderHero();
  $('#hoyHero').innerHTML = hero.html;

  renderTiempo();
  renderHabitos();

  const gastoHoy = gastosDe(h, h).reduce((s, m) => s + movIDR(m), 0);
  const mes = h.slice(0, 7);
  const delMes = S.movs.filter(m => m.fecha.startsWith(mes));
  const ing = delMes.filter(m => m.tipo === 'ingreso').reduce((s, m) => s + movIDR(m), 0);
  const gas = delMes.filter(m => m.tipo === 'gasto').reduce((s, m) => s + movIDR(m), 0);
  const bal = ing - gas;

  $('#hoyMetrics').innerHTML =
    metrica('Gastado hoy', fmtIDRcorto(gastoHoy), fmtEUR(idrAeur(gastoHoy)), '') +
    metrica('Balance del mes', fmtIDRcorto(bal), fmtEUR(idrAeur(bal)), bal >= 0 ? 'pos' : 'neg');

  renderTareas();

  // el presupuesto sólo se repite aquí si arriba manda el visado
  if (hero.comidaAparte) {
    const c = semanaComida();
    const cls = c.gastado > c.pres ? 'over' : c.gastado > c.pres * 0.8 ? 'warn' : '';
    $('#hoyComida').innerHTML =
      secH('compra', 'accent', 'Compra de esta semana', '<button class="link" data-sheet="ajustes">Cambiar tope</button>') +
      '<div class="card pad">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">' +
          '<b class="num" style="font-size:16px">' + fmtIDR(c.gastado) + '</b>' +
          '<span class="note">de ' + fmtIDR(c.pres) + '</span></div>' +
        '<div class="bar"><i class="' + cls + '" style="width:' + c.pct + '%"></i></div>' +
        '<div class="bar-l"><span>' + fechaCorta(c.l) + ' – ' + fechaCorta(c.d) + '</span>' +
        '<span>' + (c.queda >= 0 ? 'Quedan ' + fmtIDR(c.queda) : 'Pasado ' + fmtIDR(-c.queda)) + '</span></div>' +
      '</div>';
  } else {
    $('#hoyComida').innerHTML = '';
  }

  // eventos de hoy y mañana
  const m1 = sumaDias(h, 1);
  const evsH = eventosEnDia(h), evsM = eventosEnDia(m1);
  let ev = '';
  if (evsH.length) ev += '<div class="row" style="background:var(--surface-2);padding:5px 12px"><span class="pill a">Hoy</span></div>' + evsH.map(e => filaEvento(e, h)).join('');
  if (evsM.length) ev += '<div class="row" style="background:var(--surface-2);padding:5px 12px"><span class="pill">Mañana</span></div>' + evsM.map(e => filaEvento(e, m1)).join('');
  $('#hoyEventosSec').innerHTML =
    secH('agenda', 'info', 'Hoy y mañana', '<button class="link" data-go="agenda">Ver agenda</button>') +
    '<div class="card">' + (ev ||
      '<div class="empty">Nada apuntado.<br><button class="link" data-sheet="evento">Añadir algo</button></div>') + '</div>';

  // pagos recurrentes en los próximos 7 días
  const mesAhora = h.slice(0, 7);
  const prox = recurProximos(7);
  $('#hoyPagos').innerHTML = prox.length
    ? secH('dinero', 'amber', 'Te toca pagar', '<button class="link" data-go="dinero">Gestionar</button>') +
      '<div class="card">' + prox.map(p => {
        const hecho = p.r.ultimoPago === mesAhora;
        const esIng = p.r.tipo === 'ingreso';
        return '<div class="row' + (hecho ? ' done' : '') + '">' +
          '<div class="stripe ' + (hecho ? 'a' : p.dias <= 2 ? 'n' : 'm') + '"></div>' +
          '<div class="row-main"><div class="row-t">' + esc(p.r.nombre) + '</div>' +
          '<div class="row-s">' + (hecho ? (esIng ? 'ya cobrado' : 'ya pagado') + ' este mes'
            : (p.dias === 0 ? 'hoy' : p.dias === 1 ? 'mañana' : 'en ' + p.dias + ' días') + ' · día ' + p.r.dia) + '</div></div>' +
          '<div class="row-fin"><b class="num">' + fmtIDRcorto(p.idr) + '</b>' +
          '<span class="row-s cif">' + fmtEUR(idrAeur(p.idr)) + '</span></div>' +
          (hecho ? '' : '<button class="btn btn-sm" data-pagar="' + p.r.id + '" style="flex:none">' + (esIng ? 'Cobrado' : 'Pagado') + '</button>') +
        '</div>';
      }).join('') + '</div>'
    : '';

  // últimos movimientos
  const ult = S.movs.slice().sort((a, b) => b.fecha.localeCompare(a.fecha) || b.id.localeCompare(a.id)).slice(0, 4);
  $('#hoyMovsSec').innerHTML =
    secH('dinero', 'accent', 'Últimos movimientos', '<button class="link" data-go="dinero">Ver todo</button>') +
    '<div class="card">' + (ult.length ? ult.map(filaMov).join('')
      : '<div class="empty">Todavía no has apuntado nada.<br><button class="link" data-sheet="gasto">Apuntar un gasto</button></div>') + '</div>';
}

function metrica(k, v, u, cls) {
  return '<div class="metric"><div class="k">' + esc(k) + '</div>' +
    '<div class="v num ' + (cls || '') + '">' + esc(v) + '</div>' +
    '<div class="u cif">' + esc(u) + '</div></div>';
}

/* ---------------------------- AGENDA ---------------------------- */

function renderAgenda() {
  const y = calMes.getFullYear(), m = calMes.getMonth();
  $('#calLabel').textContent = MESES[m].charAt(0).toUpperCase() + MESES[m].slice(1) + ' ' + y;

  const primero = new Date(y, m, 1);
  const off = (primero.getDay() + 6) % 7;
  const ini = new Date(y, m, 1 - off);
  const h = hoyIso();
  let g = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i);
    const f = iso(d);
    const fuera = d.getMonth() !== m;
    const tiene = eventosEnDia(f).length > 0;
    g += '<button class="cal-d' + (fuera ? ' out' : '') + (f === h ? ' today' : '') + '"' +
      ' aria-selected="' + (f === diaSel) + '" data-dia="' + f + '">' +
      d.getDate() + (tiene ? '<span class="dot"></span>' : '<span style="height:4px"></span>') + '</button>';
  }
  $('#calGrid').innerHTML = g;

  const evs = eventosEnDia(diaSel);
  $('#agendaDiaSec').innerHTML =
    secH('agenda', 'accent', etiquetaDia(diaSel) + ' · ' + fechaLarga(diaSel),
      '<button class="link" id="calHoy">Ir a hoy</button>') +
    '<div class="card">' + (evs.length ? evs.map(e => filaEvento(e, diaSel)).join('')
      : '<div class="empty">Nada este día.<br><button class="link" data-sheet="evento">Añadir</button></div>') + '</div>';
  $('#calHoy').onclick = () => { diaSel = hoyIso(); calMes = new Date(); renderAgenda(); };

  // próximos 30 días — de los que se repiten, sólo la siguiente vez
  const prox = [], vistos = new Set();
  for (let i = 0; i <= 30 && prox.length < 12; i++) {
    const f = sumaDias(h, i);
    if (f === diaSel) continue;
    eventosEnDia(f).forEach(e => {
      if (evHecho(e, f) || vistos.has(e.id)) return;
      vistos.add(e.id);
      prox.push({ e, f });
    });
  }
  $('#agendaProxSec').innerHTML =
    secH('reloj', 'info', 'Lo que viene') +
    '<div class="card">' + (prox.length
      ? prox.slice(0, 8).map(p =>
          '<button class="row" style="width:100%;text-align:left" data-dia="' + p.f + '">' +
            '<div class="stripe a"></div>' +
            '<div class="row-main"><div class="row-t">' + esc(p.e.t) + '</div>' +
            '<div class="row-s">' + esc(etiquetaDia(p.f) + (p.e.hora ? ' · ' + p.e.hora : '')) + '</div></div>' +
          '</button>').join('')
      : '<div class="empty">Nada en los próximos 30 días.</div>') + '</div>';
}

function precioDe(nombre, catPrecio) {
  return S.precios[nombre.toLowerCase()] || catPrecio || 0;
}

function buscarCatalogo(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const DIACRITICOS = new RegExp('[\\u0300-\\u036f]', 'g');
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(DIACRITICOS, '');
  const nq = norm(q);
  // Escribiendo "agua" quieres «Agua», no «Aguacate»: una palabra entera del
  // nombre vale más que un simple prefijo.
  const palabras = (s) => s.split(/[^a-z0-9]+/).filter(Boolean);
  return CATALOGO
    .map(c => {
      const a = norm(c[0]), b = norm(c[1]);
      const pa = palabras(a), pb = palabras(b);
      let score = -1;
      if (a === nq || b === nq) score = 0;
      else if (pa[0] === nq || pb[0] === nq) score = 1;   // «agua» antes que «espinaca de agua»
      else if (pa.includes(nq) || pb.includes(nq)) score = 2;
      else if (a.startsWith(nq)) score = 3;
      else if (b.startsWith(nq)) score = 4;
      else if (a.includes(nq)) score = 5;
      else if (b.includes(nq)) score = 6;
      return { c, score };
    })
    .filter(x => x.score >= 0)
    .sort((a, b) => a.score - b.score)
    .slice(0, 7)
    .map(x => x.c);
}

function anadirItem(es, id, donde, precio, unidad) {
  const ya = S.lista.find(i => i.nombre.toLowerCase() === es.toLowerCase() && !i.hecho);
  if (ya) { ya.qty += 1; toast(es + ' ×' + ya.qty); }
  else {
    S.lista.push({
      id: uid(), nombre: es, ind: id || '', donde: donde || 'otro',
      precio: precioDe(es, precio), unidad: unidad || 'ud', qty: 1, hecho: false

    toast(es + ' añadido');

  guardar(); renderCompra();
}

/* ---------------------------- modo mercado ---------------------------- */

let mktIdx = 0;

function abrirMercado() {
  const pend = S.lista.filter(i => !i.hecho);
  if (!pend.length) { toast('No queda nada por comprar'); return; }
  mktIdx = 0;
  pintarMercado();
}

// Veredicto sobre el precio que te cantan, comparado con lo que sueles pagar.
function juzgarPrecio(pedido, referencia, qty) {
  if (!referencia || !pedido) return null;
  const esperado = referencia * qty;
  const dif = (pedido - esperado) / esperado;
  if (dif > 0.35) return { c: 'n', t: 'Te piden un ' + Math.round(dif * 100) + '% más de lo normal', s: 'Regatea: sueles pagar ' + fmtIDR(esperado) };
  if (dif > 0.12) return { c: 'm', t: 'Un poco caro, un ' + Math.round(dif * 100) + '% por encima', s: 'Lo normal para ti son ' + fmtIDR(esperado) };
  if (dif < -0.15) return { c: 'a', t: 'Buen precio, un ' + Math.round(-dif * 100) + '% más barato', s: 'Sueles pagar ' + fmtIDR(esperado) };
  return { c: 'a', t: 'Precio normal', s: 'Lo de siempre, ' + fmtIDR(esperado) };
}

function pintarMercado() {
  const pend = S.lista.filter(i => !i.hecho);
  if (!pend.length) { cerrarMercado(); toast('¡Lista completa!'); renderCompra(); return; }
  if (mktIdx >= pend.length) mktIdx = 0;
  if (mktIdx < 0) mktIdx = pend.length - 1;
  const i = pend[mktIdx];
  const enCarro = S.lista.filter(x => x.hecho);
  const llevado = enCarro.reduce((s, x) => s + x.precio * x.qty, 0);

  $('#mktHost').innerHTML =
    '<div class="mkt">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">' +
        '<span class="mkt-count">' + (mktIdx + 1) + ' / ' + pend.length + ' · ' + (DONDE[i.donde] || DONDE.otro).n + '</span>' +
        '<button class="btn btn-sm" id="mktClose">Salir</button>' +
      '</div>' +
      '<div class="mkt-body">' +
        '<div class="note">Enséñale esto al vendedor</div>' +
        '<div class="mkt-id">' + esc(i.ind || i.nombre) + '</div>' +
        '<div class="mkt-es">' + esc(i.nombre) + '</div>' +
        '<div class="mkt-qty">' + i.qty + ' ' + esc(i.unidad) + (i.qty > 1 ? 's' : '') + '</div>' +
        '<div class="note cif">≈ ' + fmtIDR(i.precio * i.qty) + ' · ' + fmtEUR(idrAeur(i.precio * i.qty)) + '</div>' +
        '<div style="width:100%;max-width:320px;margin-top:14px">' +
          '<input class="inp num" id="mktPrecio" type="number" inputmode="numeric" step="any" ' +
            'placeholder="¿Cuánto te piden? (Rp)" style="text-align:center;font-size:19px;font-weight:600">' +
          '<div id="mktJuicio" style="margin-top:8px;min-height:36px"></div>' +
        '</div>' +
      '</div>' +
      (enCarro.length
        ? '<div class="note cif" style="text-align:center;margin-bottom:8px">En el carro: ' +
          enCarro.length + (enCarro.length === 1 ? ' cosa' : ' cosas') + ' · ' + fmtIDR(llevado) + ' · ' + fmtEUR(idrAeur(llevado)) + '</div>'
        : '') +
      '<div class="mkt-nav">' +
        '<button class="btn" id="mktPrev" style="flex:none;padding:12px 15px" aria-label="Anterior">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><path d="m15 18-6-6 6-6"/></svg></button>' +
        '<button class="btn btn-p" id="mktGot" style="flex:1;padding:13px">Ya lo tengo</button>' +
        '<button class="btn" id="mktNext" style="flex:none;padding:12px 15px" aria-label="Siguiente">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><path d="m9 18 6-6-6-6"/></svg></button>' +
      '</div>' +
    '</div>';

  const precio = $('#mktPrecio');
  precio.oninput = () => {
    const v = parseFloat(precio.value);
    const j = isFinite(v) && v > 0 ? juzgarPrecio(v, i.precio, i.qty) : null;
    $('#mktJuicio').innerHTML = j
      ? '<div class="pill ' + j.c + '" style="white-space:normal;text-align:left">' + esc(j.t) + '</div>' +
        '<div class="note num" style="margin-top:4px">' + esc(j.s) + ' · son ' + fmtEUR(idrAeur(v)) + '</div>'
      : '';
  };

  $('#mktClose').onclick = cerrarMercado;
  $('#mktPrev').onclick = () => { mktIdx--; pintarMercado(); };
  $('#mktNext').onclick = () => { mktIdx++; pintarMercado(); };
  $('#mktGot').onclick = () => {
    const it = S.lista.find(x => x.id === i.id);
    if (it) {
      const v = parseFloat(precio.value);
      if (isFinite(v) && v > 0) {
        it.precio = Math.round(v / it.qty);
        S.precios[it.nombre.toLowerCase()] = it.precio;
      }
      it.hecho = true;
    }
    guardar(); pintarMercado();
  };
}

function nombreMes(ym) {
  const [a, m] = ym.split('-').map(Number);
  return MESES[m - 1] + ' ' + a;
}
function moverMes(ym, n) {
  const [a, m] = ym.split('-').map(Number);
  const d = new Date(a, m - 1 + n, 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

/* ---------------------------- recurrentes ---------------------------- */

function diasEnMes(a, m) { return new Date(a, m, 0).getDate(); }

function recurProximos(n) {
  const out = [], h = hoyIso();
  S.recur.filter(r => r.activo !== false).forEach(r => {
    for (let i = 0; i <= n; i++) {
      const f = sumaDias(h, i), d = deIso(f);
      const ultimo = diasEnMes(d.getFullYear(), d.getMonth() + 1);
      const diaReal = Math.min(r.dia, ultimo);
      if (d.getDate() === diaReal) {
        out.push({ r, dias: i, idr: r.mon === 'EUR' ? r.val * S.fx : r.val });
        break;
      }
    }
  });
  return out.sort((a, b) => a.dias - b.dias);
}

/* Al ritmo que llevas: sólo tiene sentido en el mes en curso y con unos días
   ya corridos, si no la proyección es ruido. */
function proyeccion(gas) {
  const mesActual = hoyIso().slice(0, 7);
  const anterior = comparativa(gas);
  if (mesVis !== mesActual || gas <= 0) return anterior;
  const d = new Date();
  const dia = d.getDate(), total = diasEnMes(d.getFullYear(), d.getMonth() + 1);
  if (dia < 4 || dia >= total) return anterior;
  const fin = (gas / dia) * total;
  return '<div class="card pad" style="grid-column:1/-1">' +
    '<div class="note">A este ritmo acabas el mes en <b class="cif" style="color:var(--ink)">' + fmtIDR(fin) + '</b> ' +
    '(' + fmtEUR(idrAeur(fin)) + '). Llevas gastados ' + nf(dia) + ' de ' + nf(total) + ' días, ' +
    'una media de <b class="cif" style="color:var(--ink)">' + fmtIDR(gas / dia) + '</b> al día.</div></div>' + anterior;
}

/* Comparación con el mes anterior. Si el mes en curso va por la mitad, comparo
   contra los mismos días del mes pasado — si no, siempre parece que gastas menos. */
function comparativa(gas) {
  const prev = moverMes(mesVis, -1);
  const esActual = mesVis === hoyIso().slice(0, 7);
  const corte = esActual ? new Date().getDate() : 99;
  const gasPrev = S.movs
    .filter(m => m.tipo === 'gasto' && m.fecha.startsWith(prev) && +m.fecha.slice(8) <= corte)
    .reduce((s, m) => s + movIDR(m), 0);
  if (gasPrev <= 0 || gas <= 0) return '';
  const dif = (gas - gasPrev) / gasPrev;
  const pct = Math.round(Math.abs(dif) * 100);
  const texto = pct < 5
    ? 'Vas prácticamente igual que en ' + nombreMes(prev).split(' ')[0] + '.'
    : 'Vas un <b style="color:var(--' + (dif > 0 ? 'neg' : 'pos') + ')">' + pct + '% ' + (dif > 0 ? 'por encima' : 'por debajo') +
      '</b> de ' + nombreMes(prev).split(' ')[0] + (esActual ? ' a estas alturas de mes' : '') + '.';
  return '<div class="card pad" style="grid-column:1/-1">' +
    '<div class="note">' + texto + ' Entonces llevabas <b class="cif" style="color:var(--ink)">' + fmtIDR(gasPrev) + '</b>.</div></div>';
}

/* ---------------------------- pantalla "Más" ---------------------------- */

function motoInfo() {
  const m = S.moto;
  const out = [];
  if (m.aceiteUltimo) {
    const toca = sumaDias(m.aceiteUltimo, m.aceiteCada);
    const dias = Math.round((deIso(toca) - deIso(hoyIso())) / 86400000);
    out.push({ k: 'Aceite', v: dias < 0 ? 'atrasado ' + (-dias) + ' d' : dias === 0 ? 'hoy' : 'en ' + dias + ' d', urge: dias <= 3 });
  }
  if (m.alquilerHasta) {
    const dias = Math.round((deIso(m.alquilerHasta) - deIso(hoyIso())) / 86400000);
    out.push({ k: 'Alquiler', v: dias < 0 ? 'caducado' : dias === 0 ? 'acaba hoy' : dias + ' d', urge: dias <= 5 });
  }
  const mes = hoyIso().slice(0, 7);
  const gas = S.movs.filter(x => x.fecha.startsWith(mes) && x.cat === 'Transporte').reduce((s, x) => s + movIDR(x), 0);
  if (gas > 0) out.push({ k: 'Este mes', v: fmtIDRcorto(gas), urge: false });
  return out;
}

function segMoneda(id, val) {
  return '<div class="seg" id="' + id + '">' +

function leerSeg(id) {

function montarSeg(id) {
  $$('#' + id + ' button').forEach(b => {

/* --- movimiento (gasto / ingreso) --- */

/* Lo que repite (el warung de siempre, la gasolina) sale como atajo: un toque
   rellena el formulario en vez de teclearlo entero cada día. */
function movsFrecuentes(tipo, n) {
  const mapa = {};
  S.movs.filter(m => m.tipo === tipo && m.nota && m.nota.trim()).forEach(m => {
    const k = m.nota.trim().toLowerCase();
    if (!mapa[k]) mapa[k] = { nota: m.nota.trim(), cat: m.cat, veces: 0, val: m.val, mon: m.mon, fecha: m.fecha };
    mapa[k].veces++;
    if (m.fecha >= mapa[k].fecha) {   // el importe del último, que es el que vale hoy
      mapa[k].val = m.val; mapa[k].mon = m.mon; mapa[k].cat = m.cat; mapa[k].fecha = m.fecha;
    }
  });
  return Object.values(mapa).filter(x => x.veces >= 2)
    .sort((a, b) => b.veces - a.veces || b.fecha.localeCompare(a.fecha)).slice(0, n);
}

function sheetMov(tipo, mov) {
  const es = tipo === 'ingreso';
  const cats = es ? CAT_INGRESO : CAT_GASTO;
  const frec = mov ? [] : movsFrecuentes(tipo, 5);
  const atajos = frec.length
    ? '<div style="margin-bottom:14px">' +
        '<span style="display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">De lo que sueles apuntar</span>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
        frec.map((f, n) => '<button class="btn btn-sm" data-frec="' + n + '" style="max-width:100%">' +
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(f.nota) + '</span>' +
          '<span class="num" style="color:var(--muted);flex:none">' + (f.mon === 'EUR' ? fmtEUR(f.val) : fmtIDRcorto(f.val)) + '</span>' +
        '</button>').join('') +
        '</div></div>'
    : '';
  const cuerpo = atajos +
    campo('Cuánto', '<input class="inp num" id="mVal" type="number" inputmode="decimal" step="any" placeholder="0" value="' + (mov ? mov.val : '') + '">') +
    campo('Moneda', segMoneda('mMon', mov ? mov.mon : 'IDR') + '<div class="note cif" id="mMonEq" style="margin-top:5px"></div>') +
    campo('Categoría', '<select class="inp" id="mCat">' + opciones(cats, mov ? mov.cat : cats[0]) + '</select>') +
    campo('Concepto (opcional)', '<input class="inp" id="mNota" placeholder="' + (es ? 'Pago de Clipeamos' : 'Cena en el warung') + '" value="' + esc(mov ? (mov.nota || '') : '') + '">') +
    campo('Cuándo', '<input class="inp" id="mFecha" type="date" value="' + (mov ? mov.fecha : hoyIso()) + '">') +
    '<button class="btn btn-p btn-w" id="mOk" style="margin-top:6px;padding:12px">' + (mov ? 'Guardar cambios' : es ? 'Apuntar ingreso' : 'Apuntar gasto') + '</button>' +
    (mov ? '<button class="btn btn-danger btn-w" id="mDel" style="margin-top:8px">Borrar</button>' : '');

  abrirSheet(mov ? 'Editar movimiento' : es ? 'Nuevo ingreso' : 'Nuevo gasto', cuerpo, () => {
    montarSeg('mMon');
    const val = $('#mVal');
    const eq = () => {
      const v = parseFloat(val.value);
      $('#mMonEq').textContent = isFinite(v) && v > 0
        ? (leerSeg('mMon') === 'EUR' ? '≈ ' + fmtIDR(eurAidr(v)) : '≈ ' + fmtEUR(idrAeur(v))) : '';
    };
    val.oninput = eq;
    $$('#mMon button').forEach(b => b.addEventListener('click', () => setTimeout(eq, 0)));

    $$('[data-frec]').forEach(b => b.onclick = () => {
      const f = frec[+b.dataset.frec];
      val.value = f.val;
      $('#mNota').value = f.nota;
      if (cats.includes(f.cat)) $('#mCat').value = f.cat;
      $$('#mMon button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.mon === f.mon)));
      eq();
      val.focus(); val.select();
    });

    if (!mov) val.focus();

    $('#mOk').onclick = () => {
      const v = parseFloat(val.value);
      if (!isFinite(v) || v <= 0) { toast('Pon una cantidad'); val.focus(); return; }
      const datos = {
        tipo, val: v, mon: leerSeg('mMon'), fx: S.fx,
        cat: $('#mCat').value, nota: $('#mNota').value.trim(), fecha: $('#mFecha').value || hoyIso()
      };
      if (mov) Object.assign(mov, datos);
      else S.movs.push(Object.assign({ id: uid() }, datos));
      guardar(); cerrarSheet(); render();
      toast(mov ? 'Guardado' : es ? 'Ingreso apuntado' : 'Gasto apuntado');
    };
    if (mov) $('#mDel').onclick = () => {
      S.movs = S.movs.filter(x => x.id !== mov.id);
      guardar(); cerrarSheet(); render();
      toast('Borrado', () => { S.movs.push(mov); guardar(); render(); });
    };
  });
}

/* --- cerrar la compra --- */

function sheetCerrar() {
  const comprados = S.lista.filter(i => i.hecho);
  const est = comprados.reduce((s, i) => s + i.precio * i.qty, 0);
  const cuerpo =
    '<div class="note" style="margin-bottom:12px">Llevas ' + comprados.length + (comprados.length === 1 ? ' cosa' : ' cosas') +
    ' en el carro por un estimado de <b class="cif" style="color:var(--ink)">' + fmtIDR(est) + '</b>. Pon lo que has pagado de verdad.</div>' +
    campo('Lo que has pagado', '<input class="inp num" id="cVal" type="number" inputmode="decimal" step="any" value="' + Math.round(est) + '">') +
    campo('Moneda', segMoneda('cMon', 'IDR')) +
    campo('Dónde', '<input class="inp" id="cNota" placeholder="Pasar Kreneng, Pepito…" value="Compra">') +
    campo('Cuándo', '<input class="inp" id="cFecha" type="date" value="' + hoyIso() + '">') +
    '<button class="btn btn-p btn-w" id="cOk" style="margin-top:6px;padding:12px">Apuntar y vaciar el carro</button>' +
    '<div class="note" style="text-align:center;margin-top:8px">Cuenta para el tope semanal de comida.</div>';

  abrirSheet('Cerrar la compra', cuerpo, () => {
    montarSeg('cMon');
    $('#cOk').onclick = () => {
      const v = parseFloat($('#cVal').value);
      if (!isFinite(v) || v <= 0) { toast('Pon el importe'); return; }
      const mon = leerSeg('cMon');
      S.movs.push({
        id: uid(), tipo: 'gasto', val: v, mon, fx: S.fx, cat: 'Compra',
        nota: $('#cNota').value.trim() || 'Compra', fecha: $('#cFecha').value || hoyIso()
      });
      // aprender precios: reparte el importe real entre lo comprado
      const realIDR = mon === 'EUR' ? eurAidr(v) : v;
      if (est > 0 && comprados.length) {
        const k = realIDR / est;
        comprados.forEach(i => { S.precios[i.nombre.toLowerCase()] = Math.round(i.precio * k); });
      }
      S.lista = S.lista.filter(i => !i.hecho);
      guardar(); cerrarSheet(); render(); toast('Compra apuntada');
    };
  });
}

  abrirSheet('Listas guardadas', cuerpo, () => {

      const items = S.lista.map(i => ({ nombre: i.nombre, ind: i.ind, donde: i.donde, precio: i.precio, unidad: i.unidad, qty: i.qty }));
      pedirTexto('Guardar la lista', 'Cómo la llamas', 'La compra de siempre', 'Guardar', (n) => {
        S.plantillas.push({ id: uid(), nombre: n || 'Mi lista', items });
        guardar(); renderCompra(); toast('Lista guardada');
      });
    };
    $$('[data-pl-cargar]').forEach(b => b.onclick = () => {
      const p = S.plantillas.find(x => x.id === b.dataset.plCargar);
      if (!p) return;
      let nuevos = 0;
      p.items.forEach(i => {
        const ya = S.lista.find(x => x.nombre.toLowerCase() === i.nombre.toLowerCase() && !x.hecho);
        if (ya) ya.qty += i.qty;
        else {
          S.lista.push({ id: uid(), nombre: i.nombre, ind: i.ind, donde: i.donde,
            precio: precioDe(i.nombre, i.precio), unidad: i.unidad, qty: i.qty, hecho: false });
          nuevos++;
        }
      });
      guardar(); cerrarSheet(); renderCompra();
      toast(nuevos ? 'Añadidas ' + nuevos + ' cosas' : 'Ya lo tenías todo en la lista');
    });
    $$('[data-pl-borrar]').forEach(b => b.onclick = () => {
      const id = b.dataset.plBorrar;
      const p = S.plantillas.find(x => x.id === id);
      S.plantillas = S.plantillas.filter(x => x.id !== id);
      guardar(); cerrarSheet(); renderCompra();
      toast('Lista borrada', () => { S.plantillas.push(p); guardar(); renderCompra(); });
    });
  });
}

/* --- fotos (documentos, tickets) --- */

const CATS_FOTO = ['Documentos', 'Visado', 'Alquiler', 'Moto', 'Tickets', 'Otros'];

function sheetFotos() {
  const cuerpo =
    '<label class="btn btn-p btn-w" style="padding:11px;margin-bottom:6px">Añadir una foto' +
      '<input type="file" id="foFile" accept="image/*" style="display:none"></label>' +
    '<div class="note" style="margin-bottom:12px">Se guardan en el móvil, reducidas para que no ocupen. Útil para el visado, el pasaporte, el contrato de la villa o un ticket.</div>' +
    '<div id="foGrid"></div>';

  abrirSheet('Fotos', cuerpo, () => {
    pintarFotos();
    $('#foFile').onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      if (!f.type.startsWith('image/')) { toast('Eso no es una foto'); return; }
      toast('Guardando…');
      try {
        const blob = await encogerImagen(f, 1400, 0.82);
        const id = uid();
        await guardarFoto(id, blob);
        S.fotos.unshift({ id, nombre: f.name.replace(/\.[^.]+$/, '').slice(0, 40) || 'Foto', cat: 'Documentos', fecha: hoyIso(), peso: blob.size });
        guardarYa(); pintarFotos(); render();
        toast('Guardada (' + Math.round(blob.size / 1024) + ' KB)');
      } catch (err) { toast('No he podido guardarla'); }
      e.target.value = '';
    };
  });
}

async function pintarFotos() {
  const g = $('#foGrid');
  if (!g) return;
  if (!S.fotos.length) { g.innerHTML = '<div class="card"><div class="empty">Todavía no has guardado ninguna.</div></div>'; return; }
  g.innerHTML = '<div class="fotos">' + S.fotos.map(f =>
    '<button class="foto" data-foto="' + f.id + '"><img id="img-' + f.id + '" alt="' + esc(f.nombre) + '">' +
    '<span class="et">' + esc(f.nombre) + '</span></button>').join('') + '</div>';
  $$('[data-foto]').forEach(b => b.onclick = () => verFoto(b.dataset.foto));
  for (const f of S.fotos) {
    try {
      const blob = await leerFoto(f.id);
      const im = document.getElementById('img-' + f.id);
      if (blob && im) im.src = URL.createObjectURL(blob);
    } catch (e) { /* si falta la imagen, se queda el hueco */ }
  }
}

async function verFoto(id) {
  const meta = S.fotos.find(f => f.id === id);
  if (!meta) return;
  const blob = await leerFoto(id);
  const url = blob ? URL.createObjectURL(blob) : '';
  abrirSheet(meta.nombre,
    (url ? '<img src="' + url + '" style="width:100%;border-radius:var(--radius);display:block;margin-bottom:12px">'
         : '<div class="empty">La imagen se ha perdido.</div>') +
    campo('Nombre', '<input class="inp" id="fvN" value="' + esc(meta.nombre) + '">') +
    campo('Categoría', '<select class="inp" id="fvC">' + opciones(CATS_FOTO, meta.cat) + '</select>') +
    '<div class="note" style="margin-bottom:12px">Guardada el ' + fechaLarga(meta.fecha) + ' · ' + Math.round((meta.peso || 0) / 1024) + ' KB</div>' +
    '<button class="btn btn-p btn-w" id="fvOk" style="padding:11px">Guardar</button>' +
    '<button class="btn btn-danger btn-w" id="fvDel" style="margin-top:7px">Borrar la foto</button>',
    () => {
      $('#fvOk').onclick = () => {
        meta.nombre = $('#fvN').value.trim() || meta.nombre;
        meta.cat = $('#fvC').value;
        guardarYa(); cerrarSheet(); sheetFotos(); toast('Guardada');
      };
      $('#fvDel').onclick = () => {
        confirmar('¿Borrar la foto?', 'Se va del móvil y no se puede recuperar.', 'Sí, borrarla', async () => {
          await borrarFoto(id);
          S.fotos = S.fotos.filter(f => f.id !== id);
          guardarYa(); sheetFotos(); render(); toast('Borrada');
        });
      };
    });
}

async function descargar(nombre, datos, tipo) {
  try {
    const dl = await window.claude?.use?.('downloads');
    if (dl) { await dl.save({ filename: nombre, data: datos }); toast('Descargado'); return; }
  } catch (e) { /* el visor puede rechazarla */ }
  try {
    const url = URL.createObjectURL(new Blob([datos], { type: tipo }));
    const a = document.createElement('a');
    a.href = url; a.download = nombre; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Descargado');
  } catch (e) { toast('No he podido descargar — usa "Copiar datos"'); }
}

function exportar() {
  return descargar('bali-harian-' + hoyIso() + '.json', JSON.stringify(S, null, 2), 'application/json');
}

function exportarCsv() {
  if (!S.movs.length) { toast('No hay nada que exportar'); return; }
  // Para el Excel español: separador punto y coma, coma decimal y SIN puntos de
  // millar (con ellos la columna entra como texto y no se puede sumar).
  const num = (n, dec) => n.toFixed(dec).replace('.', ',');
  const filas = [['Fecha', 'Tipo', 'Categoría', 'Concepto', 'Importe', 'Moneda', 'Rupias', 'Euros']];
  S.movs.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(m => {
    filas.push([
      m.fecha, m.tipo === 'ingreso' ? 'Ingreso' : 'Gasto', m.cat, m.nota || '',
      num(m.val, m.mon === 'EUR' ? 2 : 0), m.mon,
      num(Math.round(movIDR(m)), 0), num(movEUR(m), 2)
    ]);
  });
  // BOM explícito, si no Excel se come los acentos
  const csv = '\uFEFF' + filas.map(f =>
    f.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')
  ).join('\r\n');
  return descargar('gastos-' + hoyIso() + '.csv', csv, 'text/csv;charset=utf-8');
}

/* ---------------------------- internet ---------------------------- */

let ultimoRefresco = 0;

async function refrescarDeInternet() {
  if (!navigator.onLine) return;
  if (Date.now() - ultimoRefresco < 10 * 60 * 1000) return;   // como mucho cada 10 min
  ultimoRefresco = Date.now();

  const antes = S.fx;
  try { await actualizarCambio(false); } catch (e) {}

  const w = tiempoGuardado();
  const caducado = !w || w.dia !== hoyIso() || (Date.now() - (w.momento || 0)) > 45 * 60 * 1000;
  if (caducado) { try { await traerTiempo(); } catch (e) {} }

  render();
  if (S.fx !== antes) toast('Cambio del día: ' + nf(S.fx) + ' Rp por euro');
}
